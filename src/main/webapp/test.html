
<!DOCTYPE html>
<html>
<script>
	function returnMenu(name, uri) {
		document.menuForm.actionName.value=name;
		document.menuForm.action=uri;
		document.menuForm.submit();
	}
</script>
<head>
	<meta charset="UTF-8">
	<title>生産メニュー Lv.01</title>
	<link rel="stylesheet" href="./css/skyblue_k.css">
</head>
<body>
<header>
		<div class="container bg-dark padding-y-10">
		<h1>生産メニュー Lv.01</h1>
	</div>
</header>
<div class="container padding-y-5 text-left">
	<form name="menuForm" method="post" >
		<div class="row text-right">
			<button class="btn btn-dark" onclick="returnMenu('menu01','./action01')">メニューへ戻る</button>
		</div>

		<div class="container padding-y-5 text-center">
			<button type="button" class="btn btn-dark" onclick="returnMenu('productList01','./productAction01')">商品一覧 Lv.01</button>
		</div>
</form></div>
</body>
</html>
